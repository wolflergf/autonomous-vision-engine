[project]
name = "aion2-auto"
version = "0.1.0"
description = "Aion automation engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "ultralytics",
    "pyside6",
    "opencv-python",
    "mss",
    "loguru",
    "pywin32",
    "pygetwindow>=0.0.9",
    "onnx>=1.23.2",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.pytest]
